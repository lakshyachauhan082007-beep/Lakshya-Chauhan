<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <form action="a" align="center">
        <label for="Full Name">Full Name:</label>
        <input type="text" id="Full Name" name="Full Name"><br><br>
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email"><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>
        <label for="checkIn">Check-in:</label>
        <input type="date" id="checkIn" name="checkIn"><br><br>
        <label for="checkOut">Check-out:</label>
        <input type="date" id="checkOut" name="checkOut"><br><br>
        <label for="roomType">Room Type:</label>
        <select id="roomType" name="roomType">
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="luxury">Luxury </option>
            <option value="suite">Suite</option>
        </select><br><br>
        <label for="Guests">Number of Guests:</label>
        <input type="number" name="Guests" id="Guests" min="1"><br><br>
        <label for="Request">Special Requests:</label><br><br
        <textarea> name="Specialrequests" id="Specialrequests" rows="4" cols="50"></textarea><br><br>
        <button type="submit" value="Book Now">book now</button>
        <button type="submit" value="Submit">reset form</button>
     </form>


</body>
</html>
